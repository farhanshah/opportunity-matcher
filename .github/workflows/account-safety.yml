name: OppMatcher account safety
on:
  push:
    branches: [main]
    paths:
      - 'app-cloud-v13.js'
      - 'app-cloud-bridge.js'
      - 'api/linkedin.js'
      - 'api/linkedin-callback.js'
      - 'lib/linkedin-oidc.js'
      - 'tests/linkedin-auth.test.mjs'
      - 'api/welcome-email.js'
      - 'api/welcome-now.js'
      - 'api/auth-providers.js'
      - 'lib/welcome-delivery.js'
      - 'tests/auth-security.test.mjs'
      - 'app-v71-password-recovery-v2.js'
      - 'lib/welcome-content.js'
      - 'tests/welcome-email.test.mjs'
      - '.github/workflows/account-safety.yml'
  workflow_dispatch:
concurrency:
  group: oppmatcher-account-safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  account-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: JavaScript syntax
        run: |
          node --check app-cloud-v13.js
          node --check app-cloud-bridge.js
          node --check api/welcome-email.js
          node --check api/welcome-now.js
          node --check api/auth-providers.js
          node --check api/linkedin.js
          node --check api/linkedin-callback.js
          node --check lib/linkedin-oidc.js
          node --check lib/welcome-delivery.js
          node --check app-v71-password-recovery-v2.js
          node --check lib/welcome-content.js
      - name: Welcome message tests
        run: node --test tests/welcome-email.test.mjs tests/auth-security.test.mjs tests/linkedin-auth.test.mjs
