name: OppMatcher automation and launch integrity
on:
  push:
    branches: [main]
    paths:
      - 'api/verify-worldwide.js'
      - 'api/discover-grantsgov.js'
      - 'api/discover.js'
      - 'api/source-listings.js'
      - 'api/promote-source-snapshots.js'
      - 'api/reverify.js'
      - 'api/expand-providers.js'
      - 'api/automation-health-watch.js'
      - 'api/health.js'
      - 'api/opportunities.js'
      - 'lib/world-verification.js'
      - 'lib/source-listings.js'
      - 'worldwide.html'
      - 'worldwide-v1.js'
      - 'lib/automation-health.js'
      - 'lib/auto-discovery.js'
      - 'lib/official-facts.js'
      - 'lib/verification-eligibility.js'
      - 'lib/grantsgov-feed.js'
      - 'tests/verification-eligibility.test.mjs'
      - 'tests/grantsgov-feed.test.mjs'
      - 'tests/stale-catalogue-ui.test.mjs'
      - 'app-v08-base.js'
      - 'app-v08-match.js'
      - 'app-v08-boot.js'
      - 'app-v08-tracker.js'
      - 'lib/daily-discovery-email.js'
      - 'tests/provider-expansion.test.mjs'
      - 'tests/source-listings.test.mjs'
      - 'tests/security-hardening.test.mjs'
      - 'tests/automation-health.test.mjs'
      - 'tests/official-facts.test.mjs'
      - 'tests/discovery-publish.test.mjs'
      - 'tests/auto-discovery.test.mjs'
      - 'tests/world-verification.test.mjs'
      - 'tests/reverify-schedule.test.mjs'
      - 'tests/daily-discovery-email.test.mjs'
      - 'vercel.json'
      - '.github/workflows/automation-launch-safety.yml'
  workflow_dispatch:
jobs:
  launch-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked application dependencies
        run: npm install --no-save --ignore-scripts --no-audit --no-fund
      - name: Parse protected API code and helpers
        run: |
          node --check app-v08-base.js
          node --check app-v08-match.js
          node --check app-v08-boot.js
          node --check app-v08-tracker.js
          node --check api/verify-worldwide.js
          node --check api/discover.js
          node --check api/discover-grantsgov.js
          node --check lib/grantsgov-feed.js
          node --check api/source-listings.js
          node --check api/promote-source-snapshots.js
          node --check lib/source-listings.js
          node --check worldwide-v1.js
          node --check api/reverify.js
          node --check api/expand-providers.js
          node --check api/automation-health-watch.js
          node --check lib/automation-health.js
          node --check lib/official-facts.js
          node --check lib/verification-eligibility.js
          node --check api/health.js
          node --check api/opportunities.js
      - name: Automation, publication, verification and security tests
        run: |
          node --test tests/auto-discovery.test.mjs tests/official-facts.test.mjs tests/discovery-publish.test.mjs tests/verification-eligibility.test.mjs tests/grantsgov-feed.test.mjs tests/stale-catalogue-ui.test.mjs tests/world-verification.test.mjs tests/reverify-schedule.test.mjs tests/provider-expansion.test.mjs tests/automation-health.test.mjs tests/daily-discovery-email.test.mjs tests/security-hardening.test.mjs tests/source-listings.test.mjs
