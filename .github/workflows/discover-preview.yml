name: OppMatcher turquoise Discover preview
on:
  push:
    branches: [main]
    paths:
      - 'discover-preview.html'
      - 'discover-preview.css'
      - 'discover-preview.js'
      - 'design-preview.html'
      - 'tests/discover-preview.test.mjs'
      - '.github/workflows/discover-preview.yml'
  workflow_dispatch:
jobs:
  discover-preview-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate client-side code
        run: node --check discover-preview.js
      - name: Discover functionality and production-isolation tests
        run: node --test tests/discover-preview.test.mjs
