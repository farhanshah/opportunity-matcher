name: OppMatcher discovery safety
on:
  push:
    branches: [main]
    paths:
      - 'lib/auto-discovery.js'
      - 'lib/official-facts.js'
      - 'tests/official-facts.test.mjs'
      - 'tests/discovery-publish.test.mjs'
      - 'lib/monitor.js'
      - 'api/monitor.js'
      - 'tests/monitor.test.mjs'
      - 'api/discover.js'
      - 'api/reverify.js'
      - 'tests/provider-host-recovery.test.mjs'
      - 'lib/exact-ingest.js'
      - 'tests/exact-ingest.test.mjs'
      - 'tests/auto-discovery.test.mjs'
      - 'tests/reverify-schedule.test.mjs'
      - '.github/workflows/discovery-safety.yml'
  workflow_dispatch:
jobs:
  discovery-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax validation
        run: |
          node --check lib/auto-discovery.js
          node --check lib/official-facts.js
          node --check lib/monitor.js
          node --check api/monitor.js
          node --check api/discover.js
          node --check api/reverify.js
          node --check lib/exact-ingest.js
      - name: Automated verifier tests
        run: node --test tests/auto-discovery.test.mjs tests/official-facts.test.mjs tests/exact-ingest.test.mjs tests/monitor.test.mjs tests/discovery-publish.test.mjs tests/reverify-schedule.test.mjs tests/provider-host-recovery.test.mjs
