name: OppMatcher evidence triage
on:
  push:
    branches: [main]
    paths:
      - 'api/admin-health.js'
      - 'admin.html'
      - 'admin-v1.js'
      - 'admin-v1.css'
      - 'tests/evidence-triage.test.mjs'
      - '.github/workflows/evidence-triage.yml'
  workflow_dispatch:
concurrency:
  group: oppmatcher-evidence-triage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evidence-triage-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: JavaScript syntax
        run: |
          node --check api/admin-health.js
          node --check admin-v1.js
      - name: Evidence triage security tests
        run: node --test tests/evidence-triage.test.mjs
