name: OppMatcher mobile layout diagnostics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/mobile-layout-diagnostics.mjs'
      - '.github/workflows/mobile-layout-diagnostics.yml'
jobs:
  mobile-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/mobile-layout-diagnostics.mjs
