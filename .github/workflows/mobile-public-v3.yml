name: OppMatcher public mobile layout regression
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'integration-turquoise-v3.css'
      - 'integration-shell-mobile-v3.js'
      - 'tests/mobile-public-v3.mjs'
      - '.github/workflows/mobile-public-v3.yml'
  workflow_dispatch:
jobs:
  mobile-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check integration-shell-mobile-v3.js
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Test all six viewports on live homepage, Discover, Saved, Tracker and Dashboard
        run: node tests/mobile-public-v3.mjs
      - name: Keep live phone screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oppmatcher-live-mobile-v3-screens
          path: mobile-v3-screens/
          retention-days: 7
