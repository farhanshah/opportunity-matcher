name: OppMatcher source evidence comparison
on:
  push:
    branches: [main]
    paths:
      - 'api/monitor.js'
      - 'lib/source-content.js'
      - 'lib/monitor.js'
      - 'tests/source-content.test.mjs'
      - '.github/workflows/source-content.yml'
  workflow_dispatch:
concurrency:
  group: oppmatcher-source-content-${{ github.ref }}
  cancel-in-progress: true
jobs:
  comparison-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax checks
        run: |
          node --check api/monitor.js
          node --check lib/source-content.js
      - name: Source comparison tests
        run: node --test tests/source-content.test.mjs tests/monitor.test.mjs
