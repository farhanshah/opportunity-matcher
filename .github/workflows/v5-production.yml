name: OppMatcher v5 consolidated public release QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'app-v07.js'
      - 'integration-shell-v5.js'
      - 'source-chips-v1.js'
      - 'app-v92-readability.js'
      - 'orbital-v2.css'
      - 'tests/pagespeed-homepage-audit.test.mjs'
      - 'tests/pagespeed-pr-browser.mjs'
      - 'site-nav-contrast-v5.css'
      - 'tests/v5-production.test.mjs'
      - 'tests/v5-production-browser.mjs'
      - '.github/workflows/v5-production.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'blog/**/index.html'
      - 'blog/index.html'
      - 'privacy.html'
      - 'admin.html'
      - 'prepare.html'
      - 'site-nav-contrast-v5.css'
      - 'site-aux-nav-v5.css'
      - 'site-aux-nav-v5.js'
      - 'secondary-turquoise-v5.css'
      - 'integration-shell-v5.js'
      - 'source-chips-v1.js'
      - 'app-v92-readability.js'
      - 'orbital-v2.css'
      - 'tests/pagespeed-homepage-audit.test.mjs'
      - 'tests/pagespeed-pr-browser.mjs'
      - 'tests/v5-production.test.mjs'
      - 'tests/v5-production-browser.mjs'
      - '.github/workflows/v5-production.yml'
  workflow_dispatch:
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check integration-shell-v5.js
      - run: node --check app-v07.js
      - run: node --check source-chips-v1.js
      - run: node --check app-v92-readability.js
      - run: node --test tests/pagespeed-homepage-audit.test.mjs
      - run: node --check site-aux-nav-v5.js
      - run: node --test tests/v5-production.test.mjs
  real-browser:
    needs: contracts
    # Playwright 1.56.1 does not support Ubuntu 26.04 on ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Browser-test the checked-out PR for early public paint and account gate
        run: node tests/pagespeed-pr-browser.mjs
      - name: Render public pages and verify nav, contrast, ads code and deep links
        run: node tests/v5-production-browser.mjs
      - name: Archive website screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oppmatcher-v5-live-visual-qa
          path: v5-public-screens/
          retention-days: 7
