name: OppMatcher v5 staging navbar and companion page QA
on:
  push:
    branches: [main]
    paths:
      - 'nav-contrast-preview-v5.html'
      - 'site-nav-contrast-v5.css'
      - 'integration-shell-v5.js'
      - 'secondary-turquoise-v5.css'
      - 'tests/v5-staging.test.mjs'
      - 'tests/v5-staging-browser.mjs'
      - '.github/workflows/v5-staging.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check integration-shell-v5.js
      - run: node --test tests/v5-staging.test.mjs
  browser:
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/v5-staging-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-navbar-companion-visual-evidence
          path: v5-screens/
          retention-days: 7
