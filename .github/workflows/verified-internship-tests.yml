name: Verified internship feed checks
on:
  pull_request:
    paths:
      - 'api/wfp-openings.js'
      - 'api/verify-worldwide.js'
      - 'api/source-listings.js'
      - 'lib/worldwide-search.js'
      - 'lib/world-verification.js'
      - 'lib/source-listings.js'
      - 'lib/curated-provider-sources.js'
      - 'api/specific-openings.js'
      - 'lib/exact-internship-publishing.js'
      - 'index.html'
      - 'source-chips-v1.js'
      - 'site-nav-contrast-v5.css'
      - 'tests/**'
      - '.github/workflows/verified-internship-tests.yml'
  push:
    branches: [main]
    paths:
      - 'api/wfp-openings.js'
      - 'api/verify-worldwide.js'
      - 'api/source-listings.js'
      - 'lib/worldwide-search.js'
      - 'lib/world-verification.js'
      - 'lib/source-listings.js'
      - 'lib/curated-provider-sources.js'
      - 'api/specific-openings.js'
      - 'lib/exact-internship-publishing.js'
      - 'index.html'
      - 'source-chips-v1.js'
      - 'site-nav-contrast-v5.css'
      - 'tests/**'
      - '.github/workflows/verified-internship-tests.yml'
jobs:
  verify-official-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run WFP and FAO verification regression tests
        run: node --test tests/wfp-provider-diagnostics.test.mjs tests/exact-internship-publishing.test.mjs tests/fao-current-cycle.test.mjs tests/world-verification.test.mjs tests/worldwide-search.test.mjs tests/source-listings.test.mjs tests/source-chips-ui.test.mjs
