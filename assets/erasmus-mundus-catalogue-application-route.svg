<text x="42" y="53" font-family="Arial,sans-serif" font-size="28" fill="#e7fff9" font-weight="700">ONE CATALOGUE. SEPARATE APPLICATIONS.</text>
<text x="42" y="84" font-family="Arial,sans-serif" font-size="16" fill="#aedbd0">Erasmus Mundus course discovery is not a central university application.</text>
