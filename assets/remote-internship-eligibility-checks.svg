<title id="title">Four checks before applying for an international remote internship</title><desc id="desc">Starting from an official vacancy, check where you may work, your eligibility and permission, stipend and schedule, then application instructions.</desc>
<rect width="960" height="382" rx="28" fill="#0c2830"/>
<text x="48" y="61" fill="#d1fff5" font-family="Arial,sans-serif" font-size="27" font-weight="700">REMOTE INTERNSHIP: CHECK THE ACTUAL VACANCY</text>
<text x="48" y="91" fill="#9cc9c2" font-family="Arial,sans-serif" font-size="17">A “remote” label does not answer these four questions.</text>
