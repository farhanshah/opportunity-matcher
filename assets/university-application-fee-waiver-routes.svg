<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
<title id="title">Three possible routes for a university application fee</title><desc id="desc">The university may automatically waive the fee, require a request and evidence, or offer no eligible waiver. Confirm the route before submitting or paying.</desc>
<rect width="960" height="400" rx="28" fill="#0c2830"/>
<text x="45" y="57" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#e5fff9">APPLICATION FEE: CHECK BEFORE YOU PAY</text>
<rect x="270" y="86" rx="15" width="420" height="72" fill="#3a7672" stroke="#9bf4df" stroke-width="2"/>
<text x="480" y="118" fill="white" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700">Read the official programme rules</text>
<text x="480" y="143" fill="#ddfff8" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">Application fee and eligibility for this intake</text>
<path d="M480 158V189 M158 189H805 M158 189V218 M480 189V218 M805 189V218" fill="none" stroke="#80ead4" stroke-width="3"/>
<g font-family="Arial,sans-serif">
<rect x="43" y="218" width="253" height="116" rx="15" fill="#174b4b" stroke="#61d9bb" stroke-width="2"/>
<rect x="354" y="218" width="253" height="116" rx="15" fill="#174b4b" stroke="#61d9bb" stroke-width="2"/>
<rect x="665" y="218" width="252" height="116" rx="15" fill="#174b4b" stroke="#61d9bb" stroke-width="2"/>
<g fill="#ddfff8" font-size="20" font-weight="700" text-anchor="middle"><text x="169" y="252">Automatic waiver</text><text x="480" y="252">Request required</text><text x="791" y="252">Not eligible</text></g>
<g fill="#c6e9e3" font-size="15" text-anchor="middle"><text x="169" y="279">Check qualifying criteria</text><text x="169" y="302">Confirm portal shows £0</text><text x="480" y="279">Provide permitted evidence</text><text x="480" y="302">Wait for a decision</text><text x="791" y="279">Plan the stated fee</text><text x="791" y="302">or choose another route</text></g>
</g><text x="46" y="371" fill="#98c9c0" font-family="Arial,sans-serif" font-size="15">A scholarship award and a university admission fee are different things.</text></svg>